$kind: http-request
url: "{{baseUrl}}/api/courses/{{courseId}}/candidates"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Candidates are returned', function () { pm.expect(pm.response.json().candidates).to.be.an('array'); });
    language: text/javascript
order: 3000
