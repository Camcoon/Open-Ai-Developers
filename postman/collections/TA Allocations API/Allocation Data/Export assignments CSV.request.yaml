$kind: http-request
url: "{{baseUrl}}/api/assignments/export.csv"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is CSV', function () { pm.expect(pm.response.headers.get('Content-Type')).to.include('text/csv'); });
    language: text/javascript
order: 6000
