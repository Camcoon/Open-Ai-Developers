$kind: http-request
url: "{{baseUrl}}/api/assignments"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      const assignments = pm.response.json().assignments;
      if (assignments && assignments.length) pm.collectionVariables.set('assignmentId', String(assignments[0].id));
    language: text/javascript
order: 4000
