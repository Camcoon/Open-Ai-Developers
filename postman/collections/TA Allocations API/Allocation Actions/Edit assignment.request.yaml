$kind: http-request
url: "{{baseUrl}}/api/assignments/{{assignmentId}}"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
  X-User-Id: "{{xUserId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "weekly_hours": 6,
      "start_week": 1,
      "end_week": 12
    }
scripts:
  - type: afterResponse
    code: pm.test('Request succeeds', function () { pm.expect([200, 400]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
