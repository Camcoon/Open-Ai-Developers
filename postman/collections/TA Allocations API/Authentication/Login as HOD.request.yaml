$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "hod@example.com",
      "password": "hod-dev"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.collectionVariables.set('accessToken', body.access_token);
      pm.collectionVariables.set('xUserId', String(body.user.id));
      pm.test('Token and user are returned', function () {
          pm.expect(body.access_token).to.be.a('string').and.not.empty;
          pm.expect(body.user.role).to.eql('hod');
      });
    language: text/javascript
order: 1000
